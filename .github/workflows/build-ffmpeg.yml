name: Build FFmpeg for Android

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      ffmpeg_version:
        description: 'FFmpeg version (tar release)'
        default: '8.1.2'
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r27c

      - name: Install build deps
        run: sudo apt-get update && sudo apt-get install -y nasm autoconf automake libtool pkg-config

      - name: Clone ffmpeg-android-maker
        run: git clone --depth 1 https://github.com/Javernaut/ffmpeg-android-maker.git

      - name: Patch for static executables
        run: |
          cd ffmpeg-android-maker/scripts/ffmpeg
          # Ensure CLI executables (ffmpeg, ffprobe) and static libs are built
          sed -i 's/--enable-shared/--enable-static/' build.sh
          sed -i 's/--disable-static/--disable-shared/' build.sh
          sed -i '/--disable-vulkan/a\  --enable-ffmpeg --enable-ffprobe --enable-small \\' build.sh

      - name: Build FFmpeg with libwebp (arm64-v8a)
        run: |
          export ANDROID_SDK_HOME="$ANDROID_HOME"
          export ANDROID_NDK_HOME="${{ steps.setup-ndk.outputs.ndk-path }}"
          cd ffmpeg-android-maker
          bash ffmpeg-android-maker.sh \
            --target-abis=arm64-v8a \
            --source-tar=${{ inputs.ffmpeg_version || '8.1.2' }} \
            --enable-libwebp \
            --android-api-level=24

      - name: Collect and strip binaries
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          STRIP="${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip"
          mkdir -p artifacts

          # Search and collect all produced ffmpeg, ffprobe binaries and .so files
          find ffmpeg-android-maker/ -type f \( -name "ffmpeg" -o -name "ffprobe" -o -name "*.so" \) -exec cp {} artifacts/ \;

          # Strip debug symbols if binaries exist
          for f in artifacts/*; do
            if [ -f "$f" ]; then
              "$STRIP" --strip-unneeded "$f" 2>/dev/null || true
            fi
          done

          ls -la artifacts/
          file artifacts/* || true
      - name: Upload ffmpeg binaries
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-android-arm64-v8a
          path: artifacts/
          retention-days: 90

      - name: Create Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ffmpeg-${{ inputs.ffmpeg_version || '8.1.2' }}
          name: FFmpeg ${{ inputs.ffmpeg_version || '8.1.2' }} (Android arm64-v8a + libwebp)
          files: artifacts/*
          body: |
            Static FFmpeg/FFprobe for Android arm64-v8a.
            Built with libwebp encoder support (webp thumbnails).
            NDK r27c, API level 24.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Build Minimal FFmpeg for Copyparty (Android)

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      ffmpeg_version:
        description: 'FFmpeg version (e.g., 7.1, 7.0.2, 6.1.2)'
        default: '7.1'
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r27c

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm autoconf automake libtool pkg-config zip

      - name: Clone ffmpeg-android-maker
        run: git clone --depth 1 https://github.com/Javernaut/ffmpeg-android-maker.git

      - name: Patch ffmpeg-android-maker to build CLI executables
        run: |
          cd ffmpeg-android-maker/scripts/ffmpeg
          # Enable static libraries and static binaries (ffmpeg & ffprobe)
          sed -i 's/--enable-shared/--enable-static/' build.sh
          sed -i 's/--disable-static/--disable-shared/' build.sh

      - name: Build FFmpeg with libwebp
        run: |
          export ANDROID_SDK_HOME="$ANDROID_HOME"
          export ANDROID_NDK_HOME="${{ steps.setup-ndk.outputs.ndk-path }}"
          cd ffmpeg-android-maker
          
          bash ffmpeg-android-maker.sh \
            --target-abis=arm64-v8a,armeabi-v7a,x86,x86_64 \
            --source-tar=${{ inputs.ffmpeg_version || '7.1' }} \
            --enable-libwebp \
            --android-api-level=24 \
            --extra-ffmpeg-configure-flags="\
              --enable-ffmpeg \
              --enable-ffprobe \
              --enable-small \
              --disable-doc \
              --disable-debug \
              --disable-postproc \
              --enable-protocol=file,http,https,pipe \
              --enable-demuxer=image2,image2pipe,mov,matroska,avi,mp3,aac,flac,ogg,wav,webp \
              --enable-decoder=h264,hevc,vp8,vp9,av1,mjpeg,png,webp,mp3,aac,flac,vorbis,opus \
              --enable-encoder=mjpeg,png,webp,aac \
              --enable-parser=h264,hevc,vp8,vp9,av1,mjpeg,png,webp,aac,flac,mpegaudio,opus,vorbis \
              --enable-filter=scale,aresample,format,thumbnail,aformat,showwavespic"

      - name: Collect, strip, and organize binaries
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          STRIP="${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip"
          ABIS=("arm64-v8a" "armeabi-v7a" "x86" "x86_64")

          mkdir -p artifacts

          for abi in "${ABIS[@]}"; do
            TARGET_DIR="artifacts/${abi}"
            mkdir -p "$TARGET_DIR"

            # Search and copy produced ffmpeg/ffprobe binaries
            find ffmpeg-android-maker/ -type f -path "*/${abi}/*" \( -name "ffmpeg" -o -name "ffprobe" \) -exec cp {} "$TARGET_DIR/" \; 2>/devnull || true

            # Strip all symbols to reduce binary size
            for f in "$TARGET_DIR"/*; do
              if [ -f "$f" ]; then
                echo "Stripping $f..."
                "$STRIP" --strip-all "$f" 2>/devnull || true
              fi
            done
          done

          # Create a single archive of all compiled ABIs
          zip -r ffmpeg-android-binaries.zip artifacts/*

      - name: Upload Artifacts to Action Run
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-android-binaries
          path: ffmpeg-android-binaries.zip
          retention-days: 90

      - name: Create Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ffmpeg-v${{ inputs.ffmpeg_version || '7.1' }}
          name: FFmpeg Android Binaries (v${{ inputs.ffmpeg_version || '7.1' }})
          files: ffmpeg-android-binaries.zip
          body: |
            Minimal FFmpeg/FFprobe binaries compiled for Copyparty.
            Supported ABIs: arm64-v8a, armeabi-v7a, x86, x86_64.
            Includes libwebp, thumbnailing filters, and http/https/pipe protocol support.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
name: Build Minimal FFmpeg for Copyparty (Android)

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      ffmpeg_version:
        description: 'FFmpeg version (tar release, e.g., 9.0.1, 7.1.5, 6.1.6)'
        default: '9.0.1'
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r27c

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm autoconf automake libtool pkg-config zip

      - name: Clone ffmpeg-android-maker
        run: git clone --depth 1 https://github.com/Javernaut/ffmpeg-android-maker.git

      - name: Patch flags for static executables & size optimization
        run: |
          cd ffmpeg-android-maker/scripts/ffmpeg
          
          # Force static libraries and build CLI binaries (ffmpeg & ffprobe)
          sed -i 's/--enable-shared/--enable-static/' build.sh
          sed -i 's/--disable-static/--disable-shared/' build.sh
          
          # Inject size-reduction and comprehensive protocol/codec flags for Copyparty
          sed -i '/--disable-vulkan/a\
            --enable-ffmpeg \\\n\
            --enable-ffprobe \\\n\
            --enable-small \\\n\
            --disable-doc \\\n\
            --disable-debug \\\n\
            --disable-postproc \\\n\
            --enable-protocol=file,http,https,pipe \\\n\
            --enable-demuxer=image2,image2pipe,mov,matroska,avi,mp3,aac,flac,ogg,wav,webp \\\n\
            --enable-decoder=h264,hevc,vp8,vp9,av1,mjpeg,png,webp,mp3,aac,flac,vorbis,opus \\\n\
            --enable-encoder=mjpeg,png,webp,aac \\\n\
            --enable-parser=h264,hevc,vp8,vp9,av1,mjpeg,png,webp,aac,flac,mpegaudio,opus,vorbis \\\n\
            --enable-filter=scale,aresample,format,thumbnail,aformat,showwavespic \\' build.sh

      - name: Build FFmpeg with libwebp
        run: |
          export ANDROID_SDK_HOME="$ANDROID_HOME"
          export ANDROID_NDK_HOME="${{ steps.setup-ndk.outputs.ndk-path }}"
          cd ffmpeg-android-maker
          
          bash ffmpeg-android-maker.sh \
            --target-abis=arm64-v8a,armeabi-v7a,x86,x86_64 \
            --source-tar=${{ inputs.ffmpeg_version || '9.0.1' }} \
            --enable-libwebp \
            --android-api-level=24

      - name: Collect, strip, and organize binaries
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          STRIP="${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip"
          ABIS=("arm64-v8a" "armeabi-v7a" "x86" "x86_64")

          mkdir -p dist

          for abi in "${ABIS[@]}"; do
            TARGET_DIR="dist/${abi}"
            mkdir -p "$TARGET_DIR"

            # Search and copy produced ffmpeg/ffprobe binaries
            find ffmpeg-android-maker/ -type f -path "*/${abi}/*" \( -name "ffmpeg" -o -name "ffprobe" \) -exec cp {} "$TARGET_DIR/" \; 2>/devnull || true

            # Strip all symbols to reduce binary size to the absolute minimum
            for f in "$TARGET_DIR"/*; do
              if [ -f "$f" ]; then
                echo "Stripping $f..."
                "$STRIP" --strip-all "$f" 2>/devnull || true
              fi
            done
          done

          # Archive outputs
          cd dist
          zip -r ../ffmpeg-android-binaries.zip ./*
          cd ..

      - name: Create GitHub Release with Binaries
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ffmpeg-v${{ inputs.ffmpeg_version || '9.0.1' }}
          name: FFmpeg Android Binaries (v${{ inputs.ffmpeg_version || '9.0.1' }})
          files: ffmpeg-android-binaries.zip
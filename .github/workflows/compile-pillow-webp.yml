name: Compile Pillow with WebP for Android

on:
  workflow_dispatch:

jobs:
  build-pillow-matrix:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, armeabi-v7a, x86, x86_64]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK & NDK
        uses: android-actions/setup-android@v3
        # Uses standard SDK setup. NDK will be installed via sdkmanager in step below.

      - name: Install Android NDK and Build Tools
        run: |
          # Install NDK r25c (25.2.9519653) which is fully compatible with NDK-build tools in Chaquopy
          sdkmanager --install "ndk;25.2.9519653"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/25.2.9519653" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/25.2.9519653" >> $GITHUB_ENV
          
          # Install build dependencies
          sudo apt-get update
          sudo apt-get install -y patch patchelf build-essential libtool autoconf automake

      - name: Set up Chaquopy build-wheel environment
        run: |
          git clone --depth 1 https://github.com/chaquo/chaquopy.git chaquopy_src
          cd chaquopy_src/server/pypi
          
          # 1. Create chaquopy-libwebp package recipe
          mkdir -p packages/chaquopy-libwebp
          cat << 'EOF' > packages/chaquopy-libwebp/meta.yaml
          package:
            name: chaquopy-libwebp
            version: "1.3.2"

          build:
            number: 0

          source:
            url: https://github.com/webmproject/libwebp/archive/refs/tags/v1.3.2.tar.gz
          EOF
          
          cat << 'EOF' > packages/chaquopy-libwebp/build.sh
          #!/bin/bash
          set -eu
          ./autogen.sh
          ./configure --host=$HOST --prefix=$PREFIX --disable-shared --enable-static
          make -j $CPU_COUNT
          make install
          
          # Clean up unneeded files
          rm -rf $PREFIX/bin
          rm -rf $PREFIX/share
          EOF
          chmod +x packages/chaquopy-libwebp/build.sh

          # 2. Modify Pillow package recipe to require chaquopy-libwebp
          cat << 'EOF' > packages/pillow/meta.yaml
          package:
            name: pillow
            version: "11.0.0"

          requirements:
            host:
              - chaquopy-libjpeg 1.5.3
              - chaquopy-freetype 2.9.1
              - chaquopy-libwebp 1.3.2
          EOF

      - name: Download Chaquopy Compilation target
        run: |
          cd chaquopy_src
          # Download compilation target for CPython 3.10
          target/download-target.sh maven/com/chaquo/python/target/3.10.15-0

      - name: Build Pillow Wheel
        run: |
          cd chaquopy_src/server/pypi
          
          # Activate virtualenv for dependencies
          python -m venv build_env
          source build_env/bin/activate
          pip install -r requirements.txt
          
          # Export env variables for build-wheel script
          export ANDROID_HOME=$ANDROID_HOME
          export ANDROID_NDK=$ANDROID_NDK_ROOT
          
          # Run the builder
          ./build-wheel.py --python 3.10 --abi ${{ matrix.abi }} chaquopy-libwebp
          ./build-wheel.py --python 3.10 --abi ${{ matrix.abi }} pillow
          
          # Copy outputs
          mkdir -p ../../../output_wheels
          cp dist/*.whl ../../../output_wheels/

      - name: Upload Wheel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pillow-wheel-${{ matrix.abi }}
          path: output_wheels/*.whl

  commit-wheels:
    runs-on: ubuntu-22.04
    needs: build-pillow-matrix
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download all wheels
        uses: actions/download-artifact@v4
        with:
          path: downloaded_wheels

      - name: Stage wheels in app/libs/
        run: |
          mkdir -p app/libs
          find downloaded_wheels -name "*.whl" -exec cp {} app/libs/ \;
          ls -R app/libs

      - name: Commit and push built wheels
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/libs/
          git diff-index --quiet HEAD || git commit -m "chore: commit cross-compiled Pillow wheels with WebP support"
          git push origin HEAD:${{ github.ref_name }}

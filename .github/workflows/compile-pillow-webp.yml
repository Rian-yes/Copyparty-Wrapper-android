name: Compile Pillow with WebP for Android

on:
  workflow_dispatch:

jobs:
  build-pillow-matrix:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            cc: aarch64-linux-android24-clang
            ld: aarch64-linux-android-ld
            plat: android_24_arm64_v8a
          - abi: armeabi-v7a
            cc: armv7a-linux-androideabi24-clang
            ld: arm-linux-androideabi-ld
            plat: android_24_armeabi_v7a
          - abi: x86
            cc: i686-linux-android24-clang
            ld: i686-linux-android-ld
            plat: android_24_x86
          - abi: x86_64
            cc: x86_64-linux-android24-clang
            ld: x86_64-linux-android-ld
            plat: android_24_x86_64

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c
          link-to-sdk: true

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential nasm

      - name: Compile libwebp for Android (${{ matrix.abi }})
        run: |
          mkdir -p build_webp/dist
          cd build_webp
          curl -L https://github.com/webmproject/libwebp/archive/refs/tags/v1.3.2.tar.gz -o libwebp.tar.gz
          tar -xzf libwebp.tar.gz
          cd libwebp-1.3.2
          mkdir build && cd build
          cmake -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_ROOT/build/cmake/android.toolchain.cmake \
                -DANDROID_ABI=${{ matrix.abi }} \
                -DANDROID_PLATFORM=android-24 \
                -DCMAKE_INSTALL_PREFIX=../dist \
                -DWEBP_BUILD_WEBP_JS=OFF \
                -DWEBP_BUILD_CWEBP=OFF \
                -DWEBP_BUILD_DWEBP=OFF \
                -DWEBP_BUILD_GIF2WEBP=OFF \
                -DWEBP_BUILD_IMG2WEBP=OFF \
                -DWEBP_BUILD_VWEBP=OFF \
                -DWEBP_BUILD_WEBPINFO=OFF \
                -DWEBP_BUILD_WEBPMUX=OFF \
                -DWEBP_BUILD_EXTRAS=OFF \
                -DBUILD_SHARED_LIBS=OFF \
                ..
          make -j$(nproc) install

      - name: Setup Cross-Compilation Environment and Build Pillow Wheel
        run: |
          python -m pip install --upgrade pip setuptools wheel
          
          # Clone Pillow
          git clone --depth 1 --branch 11.0.0 https://github.com/python-pillow/Pillow.git pillow_src
          cd pillow_src
          
          # Configure environment variables for cross-compiling
          export CC=$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/${{ matrix.cc }}
          export LD=$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/${{ matrix.ld }}
          export AR=$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar
          export RANLIB=$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ranlib
          
          export CFLAGS="-I${{ github.workspace }}/build_webp/dist/include"
          export LDFLAGS="-L${{ github.workspace }}/build_webp/dist/lib"
          
          # Force Pillow's setup.py to find our cross-compiled libwebp
          export LPY_WEBP_PATH="${{ github.workspace }}/build_webp/dist"
          
          # Build Pillow Wheel for target Android platform ABI
          python setup.py bdist_wheel --plat-name=${{ matrix.plat }}
          
          # Copy target wheel to output directory
          mkdir -p ../output_wheels
          cp dist/*.whl ../output_wheels/

      - name: Upload Wheel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pillow-wheel-${{ matrix.abi }}
          path: output_wheels/*.whl

  commit-wheels:
    runs-on: ubuntu-22.04
    needs: build-pillow-matrix
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download all wheels
        uses: actions/download-artifact@v4
        with:
          path: downloaded_wheels

      - name: Stage wheels in app/libs/
        run: |
          mkdir -p app/libs
          find downloaded_wheels -name "*.whl" -exec cp {} app/libs/ \;
          ls -R app/libs

      - name: Commit and push built wheels
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/libs/
          git diff-index --quiet HEAD || git commit -m "chore: commit cross-compiled Pillow wheels with WebP support"
          git push origin HEAD:${{ github.ref_name }}
